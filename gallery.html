    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#10094;</button>

    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#10095;</button>
  </div>

  <!-- PASTE your footer from index.html here -->

  <script>
    const items    = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lbImg');
    let current = 0;

    function showImage(i) {
      current = (i + items.length) % items.length;
      const img = items[current].querySelector('img');
      lbImg.src = img.src;
      lbImg.alt = img.alt;
    }
    function openLightbox(i) {
      showImage(i);
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    items.forEach((item, i) => item.addEventListener('click', () => openLightbox(i)));
    document.getElementById('lbClose').onclick = closeLightbox;
    document.getElementById('lbNext').onclick  = () => showImage(current + 1);
    document.getElementById('lbPrev').onclick  = () => showImage(current - 1);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowRight') showImage(current + 1);
      if (e.key === 'ArrowLeft')  showImage(current - 1);
    });
  </script>
